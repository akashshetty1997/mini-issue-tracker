name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, schema drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: issues
          POSTGRES_PASSWORD: issues
          # The service container doesn't run docker/postgres/init.sql, so create the
          # test database directly.
          POSTGRES_DB: issue_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U issues -d issue_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://issues:issues@localhost:5432/issue_tracker_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app tests
      - name: Pytest
        run: pytest
      - name: OpenAPI schema is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- ../openapi/openapi.json

  frontend:
    name: Frontend (lint, types, API type drift, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Generated API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
