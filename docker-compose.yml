name: issue-tracker

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-issues}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-issues}
  POSTGRES_DB: ${POSTGRES_DB:-issue_tracker}

services:
  db:
    image: postgres:16-alpine
    environment: *db-env
    ports:
      # Published on 5433 so it doesn't clash with a locally installed Postgres.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-issues}:${POSTGRES_PASSWORD:-issues}@db:5432/${POSTGRES_DB:-issue_tracker}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Test runner: the `dev` image stage (with pytest/ruff/mypy). Only started via `make test`.
  api-test:
    build:
      context: ./backend
      target: dev
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-issues}:${POSTGRES_PASSWORD:-issues}@db:5432/issue_tracker_test
    volumes:
      - ./backend:/app
      - ./openapi:/openapi
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
