name: issue-tracker

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-issues}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-issues}
  POSTGRES_DB: ${POSTGRES_DB:-issue_tracker}

services:
  db:
    image: postgres:16-alpine
    environment: *db-env
    ports:
      # Published on 5433 so it doesn't clash with a locally installed Postgres.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Only holds rate-limit counters, which are disposable: no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-issues}:${POSTGRES_PASSWORD:-issues}@db:5432/${POSTGRES_DB:-issue_tracker}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_HOST_PORT:-3000}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      REDIS_URL: redis://redis:6379/0
      READ_RATE_LIMIT: ${READ_RATE_LIMIT:-120/minute}
      WRITE_RATE_LIMIT: ${WRITE_RATE_LIMIT:-30/minute}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      # Not a hard dependency: the API degrades to in-memory rate limits without Redis.
      redis:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        # The URL the browser (not the container) uses to reach the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_HOST_PORT:-8000}}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api

  # Test runner: the `dev` image stage (with pytest/ruff/mypy). Only started via `make test`.
  api-test:
    build:
      context: ./backend
      target: dev
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-issues}:${POSTGRES_PASSWORD:-issues}@db:5432/issue_tracker_test
    volumes:
      - ./backend:/app
      - ./openapi:/openapi
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
